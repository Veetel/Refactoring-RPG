name : Check Tests

on:
  push:
    branches:
      - Largeron_Saidane

jobs:
  check-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build, test, and check coverage
        run: ./gradlew clean build jacocoTestReport

      - name: Check coverage
        run: |
          if [ -f "build/reports/jacoco/test/jacocoTestReport.csv" ]; then
            echo "Coverage report found."
            COVERAGE=$(awk -F, 'NR>1 {sum+=$NF} END {print sum/NR*100}' build/reports/jacoco/test/jacocoTestReport.csv)
            echo "Coverage: $COVERAGE%"
            if (( $(echo "$COVERAGE < 80" | bc -l) )); then
              echo "Code coverage is below the required threshold of 80%."
              exit 1
            fi
          else
            echo "Coverage report not found."
            exit 1
          fi
